<!DOCTYPE html>
<html lang="en" data-theme="business">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacPopup Settings</title>
    <link rel="stylesheet" href="/app.css">
    <style>
        html, body { overflow: auto; height: auto; }
        body { background: hsl(var(--b2)) !important; }
        textarea { font-family: ui-monospace, Menlo, monospace; }
        /* daisyUI makes selects semibold; match the other inputs. */
        select.select { font-weight: 400; }
    </style>
    <script src="/settings.js" type="module"></script>
</head>
<body class="text-base-content">
    <div class="max-w-3xl mx-auto p-6">
        <div class="flex items-center gap-2 mb-4">
            <h1 class="text-2xl font-bold flex-1 whitespace-nowrap">MacPopup Settings</h1>
            <button class="btn btn-sm" id="import-yomitan" title="Import a Yomitan settings export (Settings → Backup → Export Settings)">Import Yomitan</button>
            <button class="btn btn-sm" id="import-texthooker" title="Import a texthooker-ui settings export">Import texthooker-ui</button>
            <button class="btn btn-sm btn-error btn-outline" id="reset">Reset all</button>
            <input type="file" id="import-file" accept=".json,application/json" class="hidden">
            <input type="file" id="import-yomitan-file" accept=".json,application/json" class="hidden">
        </div>
        <div id="sections" class="flex flex-col gap-6"></div>
    </div>
    <dialog id="profile-dialog" class="modal-box p-6">
        <form method="dialog" class="flex flex-col gap-4">
            <h3 class="text-lg font-semibold">Import Yomitan profile</h3>
            <select class="select select-bordered select-sm w-full"></select>
            <div class="flex justify-end gap-2">
                <button class="btn btn-sm" value="cancel">Cancel</button>
                <button class="btn btn-sm btn-primary" value="import">Import</button>
            </div>
        </form>
    </dialog>
</body>
</html>
