<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MacPopup</title>
<link rel="stylesheet" href="/viewer.css">
</head>
<body>
<header>
	<a id="home" href="/">Readings</a>
	<a id="live-link" href="/live">Live</a>
	<span id="status"></span>
	<label id="boxes-toggle" hidden><input type="checkbox" id="boxes"> Boxes</label>
	<button id="edit" hidden>Edit</button>
	<button id="delete-reading" class="destructive" hidden>Delete</button>
</header>
<main id="reading" hidden></main>
<main id="index" hidden>
	<ul id="readings"></ul>
	<p id="empty" class="empty" hidden>No readings yet. Scan an image in the MacPopup app to begin.</p>
	<div id="edit-bar" hidden>
		<button id="delete-all" class="destructive">Delete All</button>
		<button id="delete-selected" class="destructive" disabled>Delete</button>
	</div>
</main>
<main id="live" hidden>
	<div id="live-readings"></div>
	<p id="live-empty" class="empty" hidden>Nothing read yet. Enable Continuous Reading in the MacPopup app, then start a screen broadcast.</p>
</main>
<script type="module" src="/viewer.js"></script>
</body>
</html>
